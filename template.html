<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech News</title>
<style>
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    height: 100vh;
  }

  .card {
    background: var(--card-bg);
    padding: 2.5rem;
    overflow: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Big story — left column, spans both rows = half the page */
  .story-main {
    grid-column: 1;
    grid-row: 1 / span 2;
  }

  /* Two smaller stories — right column, one row each = a quarter each */
  .story-secondary {
    grid-column: 2;
  }

  .story-secondary:nth-of-type(2) {
    grid-row: 1;
  }

  .story-secondary:nth-of-type(3) {
    grid-row: 2;
  }

  .tag {
    text-transform: uppercase;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }

  .story-main h1 {
    font-size: 2.25rem;
    line-height: 1.2;
    margin: 0 0 1rem;
  }

  .story-secondary h2 {
    font-size: 1.25rem;
    line-height: 1.3;
    margin: 0 0 0.5rem;
  }

  h1 a, h2 a {
    color: inherit;
    text-decoration: none;
  }

  h1 a:hover, h2 a:hover {
    text-decoration: underline;
    color: var(--accent);
  }

  p {
    color: var(--muted);
    line-height: 1.5;
    margin: 0;
  }

  .story-main p {
    font-size: 1.05rem;
  }
</style>
</head>
<body>
  <div class="grid">
    <div class="card story-main">
      <div class="tag">Top Tech Story</div>
      <h1><a href="{{MAIN_URL}}" target="_blank" rel="noopener noreferrer">{{MAIN_HEADLINE}}</a></h1>
      <p>{{MAIN_SUMMARY}}</p>
    </div>

    <div class="card story-secondary">
      <div class="tag">Also in Tech</div>
      <h2><a href="{{SECOND_URL}}" target="_blank" rel="noopener noreferrer">{{SECOND_HEADLINE}}</a></h2>
      <p>{{SECOND_SUMMARY}}</p>
    </div>

    <div class="card story-secondary">
      <div class="tag">Also in Tech</div>
      <h2><a href="{{THIRD_URL}}" target="_blank" rel="noopener noreferrer">{{THIRD_HEADLINE}}</a></h2>
      <p>{{THIRD_SUMMARY}}</p>
    </div>
  </div>
</body>
</html>
